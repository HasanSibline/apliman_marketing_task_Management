<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first: browsers request /favicon.ico by default, and Safari does not
         use SVG favicons. The SVG follows for browsers that prefer it. iOS ignores
         SVG for the home-screen icon, so apple-touch-icon must be a PNG. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Operations</title>
    <meta name="description" content="Aura Operations: the AI-powered operations platform for planning, workflows, and team collaboration." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
